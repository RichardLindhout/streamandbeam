<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HHG Tholen — meekijken</title>
<link rel="stylesheet" href="/slide.css">
<link rel="stylesheet" href="/kijk.css">
<style>
  .watch { display: grid; grid-template-columns: minmax(220px, 0.36fr) 1fr; gap: 14px; padding: 14px; max-width: 1700px; margin: 0 auto; align-items: start; }
  @media (max-width: 860px) { .watch { grid-template-columns: 1fr; } }
  .yt { position: relative; aspect-ratio: 16 / 9; background: #000; border-radius: 10px; overflow: hidden; border: 1px solid var(--line-2); }
  .yt iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .yt .off { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); text-align: center; padding: 16px; }
  .checks { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin-top: 12px; }
  .check { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  .check small { display: block; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .07em; }
  .check b { font-size: 17px; }
  .check.bad { border-color: rgba(229, 72, 77, .6); background: rgba(229, 72, 77, .1); }
  .check.good { border-color: rgba(51, 194, 127, .5); }
  .order2 { margin: 0; padding: 6px 14px 12px 34px; columns: 2; column-gap: 28px; }
  @media (max-width: 700px) { .order2 { columns: 1; } }
  .order2 li { padding: 3px 0; color: var(--muted); }
  .order2 li.now { color: var(--text); font-weight: 700; }
</style>
</head>
<body>
<header class="top">
  <div class="brand"><i>✝</i><div>HHG Tholen<small>meekijken</small></div></div>
  <span class="hint" id="service">—</span>
  <div class="pills"><span class="pill" id="livePill"><span class="dot" id="liveDot"></span><span id="liveText">Niet live</span></span></div>
</header>
<main class="watch">
  <section>
    <div class="mon portrait"><span class="tag">Bord in de kerk</span><div class="canvas" id="board"></div></div>
    <p class="hint" id="now"></p>
  </section>
  <section>
    <div class="yt" id="yt"><div class="off" id="ytOff">Er is nu geen uitzending.</div></div>
    <div class="checks">
      <div class="check" id="cLive"><small>YouTube</small><b>—</b></div>
      <div class="check" id="cAudio"><small>Geluid op YouTube</small><b>—</b></div>
      <div class="check" id="cSent"><small>Geluid dat de kerk verstuurt</small><b>—</b></div>
    </div>
    <div class="panel" style="margin-top:12px"><h3>Volgorde van de dienst</h3><ol class="order2" id="order"></ol></div>
  </section>
</main>
<script src="/slide.js"></script>
<script>
  // Read-only page: the board as it is in church, the real YouTube stream as viewers see
  // it, and checks that YouTube actually has sound.
  var $ = function (id) { return document.getElementById(id); };
  var state = null;
  var embedded = "";

  function drawBoard() {
    if (!state) return;
    var boards = state.boards || state.slides || [];
    renderSlide($("board"), state.overrideBoard || boards[state.index], state.black, { portrait: true });
  }
  listen(function (st) {
    state = st;
    drawBoard();
    var slide = st.slides ? st.slides[st.index] : null;
    var svc = (st.services || []).filter(function (s) { return s.id === st.current; })[0];
    $("service").textContent = svc ? [svc.label, svc.date, svc.time, svc.predikant].filter(Boolean).join(" · ") : "";
    $("now").textContent = slide ? "Nu: " + slide.header + (slide.sub ? " — " + slide.sub : "") : "";
    $("order").innerHTML = svc ? svc.items.map(function (it, i) {
      return '<li class="' + (slide && slide.item === i ? "now" : "") + '">' + esc(it.label) + (it.ref ? " — " + esc(it.ref) : "") + "</li>";
    }).join("") : "";
  });
  window.addEventListener("resize", drawBoard);

  function check(el, good, text) {
    el.className = "check " + (good === true ? "good" : good === false ? "bad" : "");
    el.querySelector("b").textContent = text;
  }

  function poll() {
    fetch("/api/youtube-check").then(function (r) { return r.json(); }).then(function (c) {
      // The real YouTube player for the channel's live stream.
      if (c.channel && c.streaming && embedded !== c.channel) {
        embedded = c.channel;
        $("yt").innerHTML = '<iframe allow="autoplay; encrypted-media" allowfullscreen src="https://www.youtube.com/embed/live_stream?channel=' + encodeURIComponent(c.channel) + '&autoplay=1&mute=1"></iframe>';
      }
      if (!c.streaming && embedded) {
        embedded = "";
        $("yt").innerHTML = '<div class="off">Er is nu geen uitzending.</div>';
      }
      var ago = c.at ? Math.round(Date.now() / 1000 - c.at) + " s geleden" : "";
      if (!c.streaming) {
        check($("cLive"), null, "Niet live");
        check($("cAudio"), null, "—");
      } else if (!c.at) {
        check($("cLive"), null, "Bezig met controleren…");
        check($("cAudio"), null, "—");
      } else {
        check($("cLive"), c.live, c.live ? "Live ✓ (" + ago + ")" : c.problem);
        check($("cAudio"), c.live ? c.audio : null, c.audio ? "✓ " + c.meanDb.toFixed(0) + " dB" : c.live ? "⚠ " + c.problem : "—");
      }
      $("liveText").textContent = c.streaming ? "LIVE" : "Niet live";
      $("livePill").className = "pill" + (c.streaming ? " live" : "");
      $("liveDot").className = "dot" + (c.streaming ? " live" : "");
    }).catch(function () {});
    fetch("/api/stream").then(function (r) { return r.json(); }).then(function (s) {
      if (s.mode === "stop") return check($("cSent"), null, "—");
      check($("cSent"), !s.audioWarning, s.audioWarning ? "⚠ " + s.audioWarning.split(" — ")[0] : "✓ " + s.audioDb.toFixed(0) + " dB");
    }).catch(function () {});
  }
  setInterval(poll, 3000);
  poll();
</script>
</body>
</html>
